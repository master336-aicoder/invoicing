# 认证服务配置 - auth-service.yml
# 命名空间：ai-dev
# Group：dev
# Data ID：auth-service.yml

server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://192.168.1.6:13306/invoicing_auth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false

# JWT配置（覆盖或补充common.yml）
jwt:
  access-token-expire: 7200
  refresh-token-expire: 604800

# 日志配置
logging:
  level:
    com.invoicing.auth: DEBUG
